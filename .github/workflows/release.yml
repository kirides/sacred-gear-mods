name: Build and release mods

# A push to main that changes something under src/ builds mods.zip and publishes it as a GitHub release named
# "YYYY-MM-DD HHmm GIT_SHA" (UTC). Git tags cannot contain spaces, so the tag is "YYYY-MM-DD-HHmm-GIT_SHA".
# The zip holds a ready-to-use `mods` folder: extract it into the game folder (next to Sacred.exe).
# Pull requests / manual runs build the same zip as a workflow artifact only.

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  pull_request:
  workflow_dispatch:


jobs:
  package:
    permissions:
      contents: write   # only used to publish the release on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check every mod has a manifest
        shell: bash
        run: |
          set -e
          for d in src/*/; do
            lname=$(basename "$d" | tr '[:upper:]' '[:lower:]')
            case "$lname" in *test) continue;; esac
            [ -f "${d}mod.lua" ] || { echo "::error::${d} has no mod.lua"; exit 1; }
            [ -f "${d}main.lua" ] || { echo "::error::${d} has no main.lua"; exit 1; }
          done

      - name: Check mod-index.json
        shell: bash
        run: |
          set -e
          fail() { echo "::error::mod-index.json: $1"; exit 1; }
          jq empty mod-index.json || fail "not valid JSON"
          [ "$(jq -r '.schema' mod-index.json)" = "1" ] || fail "schema must be 1"
          # every shipped mod folder (same rule as the assembly step) must be listed
          for d in src/*/; do
            name=$(basename "$d")
            lname=$(echo "$name" | tr '[:upper:]' '[:lower:]')
            case "$lname" in *test|sector-tools) continue;; esac
            [ -f "${d}mod.lua" ] || continue
            n=$(jq --arg p "mods/$name" '[(.mods // [])[] | select(.path == $p)] | length' mod-index.json)
            [ "$n" = "1" ] || fail "src/$name is shipped but listed $n times in the index"
          done
          # every mod entry must point at a real mod whose mod.lua id matches (plugins and tools have no mod.lua here)
          while read -r id path; do
            name=${path#mods/}
            [ "$path" = "mods/$name" ] && [ -n "$name" ] || fail "path '$path' must be mods/<folder>"
            [ -d "src/$name" ] || fail "path '$path' has no folder src/$name"
            [ -f "src/$name/mod.lua" ] || fail "src/$name has no mod.lua"
            lua_id=$(grep -m1 -oE "^[[:space:]]*id[[:space:]]*=[[:space:]]*'[^']+'" "src/$name/mod.lua" | sed -E "s/.*'([^']+)'/\1/")
            [ "$lua_id" = "$id" ] || fail "entry id '$id' differs from the mod.lua id '$lua_id' of src/$name"
          done < <(jq -r '(.mods // [])[] | select((.kind // "mod") == "mod") | "\(.id) \(.path)"' mod-index.json | tr -d '\r')
          echo "mod-index.json ok: $(jq '(.mods // []) | length' mod-index.json) mods"

      - name: Check mod-index.json is up to date
        shell: bash
        run: python3 tools/make_mod_index.py --check

      - name: Assemble the mods folder
        shell: bash
        run: |
          set -e
          rm -rf dist && mkdir -p dist/mods
          for d in src/*/; do
            name=$(basename "$d")
            # Every folder whose name ends in "test" (*_selftest, *_bosstest, ...) is an automation test (they overwrite saves etc.); sector-tools is for server admins.
            lname=$(echo "$name" | tr '[:upper:]' '[:lower:]')
            case "$lname" in *test|sector-tools) continue;; esac
            mkdir -p "dist/mods/$name"
            cp -r "$d". "dist/mods/$name/"
            # Developer-only material inside a mod.
            rm -rf "dist/mods/$name/tests" "dist/mods/$name/tools"
          done
          cat > dist/README.txt <<'TXT'
          Sacred Gear mods
          ================
          Extract this zip into the Sacred game folder (the one with Sacred.exe), so that the `mods` folder
          lands next to it. Needs SacredBild + Sacred Gear: https://github.com/kirides/sacred-bild
          Start the game and press F11 to switch the mods on or off.
          Docs: https://github.com/kirides/sacred-gear-mods
          TXT
          sed -i 's/^          //' dist/README.txt
          ls dist/mods

      - name: Create the zip
        shell: bash
        run: |
          set -e
          sha="${GITHUB_SHA::7}"
          echo "RELEASE_NAME=$(date -u +'%Y-%m-%d %H%M') $sha" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$(date -u +'%Y-%m-%d-%H%M')-$sha" >> "$GITHUB_ENV"
          (cd dist && zip -qr "../mods.zip" mods README.txt)
          unzip -l mods.zip | tail -5

      - name: Upload the zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: mods
          path: mods.zip

      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          files: mods.zip
          generate_release_notes: true
          make_latest: true
